version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: ac7-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ac7_database
      MYSQL_USER: ac7
      MYSQL_PASSWORD: ac7_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/001-database.sql:ro
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20


  backend:
    image: node:18
    container_name: ac7-backend
    restart: always
    working_dir: /usr/src/app

    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules

    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_USERNAME: ac7
      DB_PASSWORD: ac7_password
      DB_DATABASE: ac7_database

    command: sh -c "npm install --no-audit --no-fund && node index.js"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - web

    expose:
      - "8080"


  frontend:
    image: node:18
    container_name: ac7-frontend
    restart: always
    working_dir: /usr/src/app

    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules

    environment:
      NODE_ENV: production
      CHOKIDAR_USEPOLLING: true
      HOST: 0.0.0.0
      DANGEROUSLY_DISABLE_HOST_CHECK: true

    command: sh -c "npm install --no-audit --no-fund && npm start"

    depends_on:
      - backend

    networks:
      - web

    expose:
      - "3000"


volumes:
  mysql_data:


networks:
  web:
    external: true